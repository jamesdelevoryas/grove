[package]
name = "grove"
version = "0.1.0"
edition = "2024"
description = "A multi-agent coding agent with a fast terminal UI"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
futures = "0.3"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "=3.4.1", features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"

[profile.release]
debug = 1
